<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>童心日记 MVP 小程序交互</title>
  <style>
    :root {
      --cream: #fff8ec;
      --cream-deep: #ffedcf;
      --orange: #ff9f43;
      --orange-dark: #d86f18;
      --green: #93d977;
      --green-dark: #438f3d;
      --ink: #45372b;
      --muted: #827063;
      --line: #edd9bd;
      --white: #fffdf8;
      --blue: #8fc9ff;
      --pink: #ffb7a8;
      --shadow: 0 18px 40px rgba(141, 91, 38, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px;
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 8%, rgba(147, 217, 119, 0.28), transparent 26%),
        radial-gradient(circle at 82% 12%, rgba(255, 159, 67, 0.25), transparent 25%),
        linear-gradient(180deg, #fffaf0, #f7ffe9);
    }

    button {
      font: inherit;
      color: inherit;
      border: 0;
    }

    .phone {
      width: min(100%, 414px);
      height: min(880px, calc(100vh - 44px));
      min-height: 760px;
      border-radius: 38px;
      background: #2f2924;
      padding: 12px;
      box-shadow: 0 28px 80px rgba(79, 47, 17, 0.26);
    }

    .miniapp {
      height: 100%;
      overflow: hidden;
      border-radius: 30px;
      background: linear-gradient(180deg, var(--cream), #fffdf6 58%, #f1ffe8);
      position: relative;
      border: 1px solid rgba(255, 255, 255, 0.45);
    }

    .statusbar {
      height: 34px;
      padding: 10px 18px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 800;
      color: rgba(69, 55, 43, 0.78);
    }

    .nav {
      height: 48px;
      padding: 0 16px;
      display: grid;
      grid-template-columns: 42px 1fr 70px;
      align-items: center;
    }

    .nav-title {
      text-align: center;
      font-weight: 900;
      font-size: 18px;
      letter-spacing: 0;
    }

    .capsule {
      height: 28px;
      border-radius: 999px;
      border: 1px solid rgba(69, 55, 43, 0.18);
      background: rgba(255, 255, 255, 0.55);
      display: flex;
      align-items: center;
      justify-content: space-around;
      color: rgba(69, 55, 43, 0.7);
      font-weight: 900;
    }

    .content {
      height: calc(100% - 82px);
      overflow: hidden;
      position: relative;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: none;
      padding: 14px 18px 18px;
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      animation: rise 260ms ease both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .home-hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 16px;
    }

    .rabbit-scene {
      min-height: 250px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 241, 216, 0.78)),
        repeating-linear-gradient(135deg, rgba(147, 217, 119, 0.14) 0 12px, rgba(255, 159, 67, 0.12) 12px 24px);
      border: 1px solid rgba(237, 217, 189, 0.9);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
    }

    .rabbit-scene::after {
      content: "";
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      height: 18px;
      border-radius: 50%;
      background: rgba(141, 91, 38, 0.13);
      filter: blur(5px);
    }

    .rabbit {
      width: 190px;
      height: 190px;
      position: relative;
      z-index: 1;
    }

    .ear {
      position: absolute;
      top: 0;
      width: 50px;
      height: 105px;
      border-radius: 30px 30px 18px 18px;
      background: #fff;
      border: 5px solid #6d5947;
    }

    .ear::after {
      content: "";
      position: absolute;
      inset: 14px 12px;
      border-radius: inherit;
      background: #ffd2c9;
    }

    .ear.left {
      left: 38px;
      transform: rotate(-12deg);
    }

    .ear.right {
      right: 38px;
      transform: rotate(12deg);
    }

    .head {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: 166px;
      height: 138px;
      border: 5px solid #6d5947;
      border-radius: 48% 48% 42% 42%;
      background: #fff;
    }

    .eye {
      position: absolute;
      top: 48px;
      width: 10px;
      height: 14px;
      border-radius: 50%;
      background: var(--ink);
    }

    .eye.left { left: 48px; }
    .eye.right { right: 48px; }

    .nose {
      position: absolute;
      top: 73px;
      left: 50%;
      width: 20px;
      height: 14px;
      border-radius: 50%;
      background: var(--pink);
      transform: translateX(-50%);
    }

    .cheek {
      position: absolute;
      top: 82px;
      width: 24px;
      height: 14px;
      border-radius: 50%;
      background: #ffd4c9;
    }

    .cheek.left { left: 26px; }
    .cheek.right { right: 26px; }

    .headline {
      margin: 0;
      font-size: 30px;
      line-height: 1.12;
      letter-spacing: 0;
    }

    .subcopy {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.48;
    }

    .theme-card {
      border-radius: 24px;
      background: var(--white);
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: var(--shadow);
    }

    .label {
      margin: 0 0 8px;
      color: var(--orange-dark);
      font-weight: 900;
      font-size: 13px;
    }

    .theme {
      margin: 0;
      font-size: 23px;
      line-height: 1.25;
      font-weight: 900;
      letter-spacing: 0;
    }

    .bottom-action {
      padding-top: 14px;
    }

    .primary {
      width: 100%;
      min-height: 68px;
      border-radius: 24px;
      background: linear-gradient(180deg, #ffba6d, var(--orange));
      box-shadow: 0 9px 0 #cd711a, 0 16px 28px rgba(216, 111, 24, 0.22);
      font-size: 21px;
      font-weight: 900;
      cursor: pointer;
    }

    .primary:active {
      transform: translateY(5px);
      box-shadow: 0 4px 0 #cd711a;
    }

    .secondary-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .soft {
      min-height: 54px;
      border-radius: 18px;
      background: #fff;
      border: 1px solid var(--line);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #ead4b7;
    }

    .soft.green {
      background: linear-gradient(180deg, #b9eca1, var(--green));
      border-color: var(--green);
      box-shadow: 0 5px 0 #519943;
    }

    .listen-screen {
      gap: 12px;
    }

    .topic-mini {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13px;
      font-weight: 800;
    }

    .listen-main {
      flex: 0 0 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-radius: 30px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.7), rgba(255, 247, 235, 0.8));
      border: 1px solid rgba(237, 217, 189, 0.85);
      min-height: 220px;
      position: relative;
      overflow: hidden;
    }

    .listening-rabbit {
      width: 118px;
      height: 118px;
      flex: 0 0 118px;
      margin: 12px 0 -4px;
      transform: none;
    }

    .listening-rabbit .ear {
      width: 31px;
      height: 65px;
      border-width: 3px;
      border-radius: 19px 19px 12px 12px;
    }

    .listening-rabbit .ear::after { inset: 9px 7px; }
    .listening-rabbit .ear.left { left: 24px; }
    .listening-rabbit .ear.right { right: 24px; }

    .listening-rabbit .head {
      width: 103px;
      height: 86px;
      bottom: 7px;
      border-width: 3px;
    }

    .listening-rabbit .eye { top: 30px; width: 6px; height: 9px; }
    .listening-rabbit .eye.left { left: 30px; }
    .listening-rabbit .eye.right { right: 30px; }
    .listening-rabbit .nose { top: 45px; width: 13px; height: 9px; }
    .listening-rabbit .cheek { top: 51px; width: 15px; height: 9px; }
    .listening-rabbit .cheek.left { left: 16px; }
    .listening-rabbit .cheek.right { right: 16px; }
    }

    .halo {
      position: absolute;
      width: 182px;
      height: 182px;
      border-radius: 50%;
      border: 3px solid rgba(255, 159, 67, 0.24);
      animation: pulse 1.5s ease-out infinite;
      opacity: 0;
      visibility: hidden;
    }

    .halo.two {
      animation-delay: 0.45s;
    }

    @keyframes pulse {
      from { opacity: 0.9; transform: scale(0.82); }
      to { opacity: 0; transform: scale(1.35); }
    }

    .listen-title {
      margin: 0;
      font-size: 25px;
      line-height: 1.15;
      letter-spacing: 0;
      font-weight: 900;
      position: relative;
      z-index: 2;
    }

    .listen-hint {
      margin: 8px 24px 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.45;
      position: relative;
      z-index: 2;
      max-height: 4.35em;
      overflow: hidden;
      overflow-wrap: anywhere;
    }

    .latest-transcript {
      flex: 0 0 68px;
      min-height: 68px;
      display: grid;
      align-content: center;
      gap: 3px;
      padding: 9px 13px;
      border-radius: 16px;
      background: #fffdf8;
      border: 2px solid #f2c98e;
      box-shadow: 0 4px 0 rgba(224, 151, 65, 0.12);
      overflow: hidden;
    }

    .latest-transcript strong {
      color: var(--orange-dark);
      font-size: 11px;
    }

    .latest-transcript span {
      display: -webkit-box;
      overflow: hidden;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      color: var(--ink);
      font-size: 14px;
      line-height: 1.35;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .revise-screen .listen-main {
      flex-basis: 300px;
      min-height: 300px;
    }

    .revise-screen .listen-hint {
      width: calc(100% - 36px);
      max-height: 7.25em;
      overflow-y: auto;
    }

    .wave {
      display: flex;
      gap: 6px;
      align-items: center;
      justify-content: center;
      height: 54px;
      margin-top: 8px;
      position: relative;
      z-index: 2;
      opacity: 0;
      visibility: hidden;
    }

    .miniapp.recording .halo,
    .miniapp.recording .wave {
      opacity: 1;
      visibility: visible;
    }

    .wave span {
      width: 8px;
      height: 18px;
      border-radius: 999px;
      background: var(--green);
      animation: wave 700ms ease-in-out infinite alternate;
    }

    .wave span:nth-child(2) { animation-delay: 90ms; background: var(--orange); }
    .wave span:nth-child(3) { animation-delay: 180ms; background: var(--blue); }
    .wave span:nth-child(4) { animation-delay: 270ms; background: var(--green); }
    .wave span:nth-child(5) { animation-delay: 360ms; background: var(--pink); }

    @keyframes wave {
      from { height: 16px; }
      to { height: 44px; }
    }

    .feed {
      height: auto;
      flex: 1 1 auto;
      min-height: 76px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 2px 2px 8px;
    }

    .bubble {
      max-width: 88%;
      padding: 11px 13px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.45;
      animation: bubble 220ms ease both;
    }

    @keyframes bubble {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .bubble.ai {
      align-self: flex-start;
      background: #fff;
      border: 1px solid var(--line);
      border-top-left-radius: 8px;
      box-shadow: 0 3px 0 rgba(224, 151, 65, 0.1);
    }

    .bubble.ai::before {
      content: "小耳朵想问";
      display: block;
      margin-bottom: 3px;
      color: #d46b17;
      font-size: 11px;
      font-weight: 900;
    }

    .bubble.child {
      align-self: flex-end;
      background: #dcf8d0;
      border: 1px solid #bde5ae;
      border-top-right-radius: 8px;
      font-weight: 800;
    }

    .bubble.system {
      align-self: center;
      max-width: 96%;
      border-radius: 999px;
      background: rgba(255, 246, 222, 0.92);
      border: 1px solid #ecd8aa;
      color: #765423;
      font-size: 12px;
      font-weight: 900;
    }

    .facts-strip {
      min-height: 45px;
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px;
    }

    .live-question {
      display: none;
      padding: 12px 14px;
      border-radius: 18px;
      background: #fff;
      border: 2px solid #f2c98e;
      color: var(--ink);
      font-size: 15px;
      line-height: 1.45;
      font-weight: 900;
      box-shadow: 0 5px 0 rgba(224, 151, 65, 0.14);
    }

    .live-question.show {
      display: block;
    }

    .live-question::before {
      content: "小耳朵想问：";
      display: block;
      margin-bottom: 3px;
      color: #d46b17;
      font-size: 12px;
    }

    .chip {
      flex: 0 0 auto;
      max-width: 180px;
      padding: 8px 10px;
      border-radius: 999px;
      background: #fff;
      border: 1px solid var(--line);
      font-size: 12px;
      font-weight: 900;
      color: var(--green-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mini-button {
      width: 100%;
      min-height: 62px;
      border-radius: 22px;
      background: linear-gradient(180deg, #b8efa0, var(--green));
      box-shadow: 0 7px 0 #519943;
      font-size: 19px;
      font-weight: 900;
      cursor: pointer;
    }

    .mini-button:disabled {
      cursor: default;
      opacity: 0.78;
    }

    .mini-button.orange {
      background: linear-gradient(180deg, #ffba6d, var(--orange));
      box-shadow: 0 7px 0 #cd711a;
    }

    .record-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .mini-button.finish {
      background: linear-gradient(180deg, #ffba6d, var(--orange));
      box-shadow: 0 7px 0 #cd711a;
    }

    .diary-screen {
      gap: 12px;
    }

    .diary-card {
      flex: 1;
      min-height: 0;
      overflow: auto;
      border-radius: 28px;
      background: #fff;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .diary-card h1 {
      margin: 0 0 12px;
      font-size: 24px;
      letter-spacing: 0;
      line-height: 1.2;
    }

    .diary-card p {
      margin: 0;
      font-size: 18px;
      line-height: 1.75;
      font-weight: 700;
    }

    .mark {
      border-radius: 8px;
      padding: 2px 4px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .mark.a { background: #fff0bd; }
    .mark.b { background: #dff9d3; }
    .mark.c { background: #e0f0ff; }

    .source-panel {
      margin-top: 16px;
      display: grid;
      gap: 8px;
    }

    .source {
      border-radius: 14px;
      background: #fff8ec;
      border: 1px solid #efd8b2;
      padding: 9px 10px;
      font-size: 12px;
      line-height: 1.45;
      color: var(--muted);
      font-weight: 800;
    }

    .source strong {
      display: block;
      color: var(--ink);
      margin-bottom: 3px;
      font-size: 13px;
    }

    .source.pass {
      background: #f1ffe9;
      border-color: #cfeabc;
      color: var(--green-dark);
    }

    .source.warn {
      background: #fff6dc;
      border-color: #ecd8aa;
      color: #765423;
    }

    .read-state {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: #f0ffe8;
      border: 1px solid #cfeabc;
      color: var(--green-dark);
      font-size: 13px;
      font-weight: 900;
    }

    .read-state.show {
      display: flex;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 3px solid #cdebbb;
      border-top-color: var(--green-dark);
      animation: spin 880ms linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .success-screen {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .success-badge {
      width: 116px;
      height: 116px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      margin: 0 auto 24px;
      color: #fff;
      background: linear-gradient(180deg, #b7ec9f, #75c861);
      box-shadow: 0 10px 0 #519943, var(--shadow);
      font-size: 64px;
      font-weight: 900;
    }

    .toast {
      position: absolute;
      left: 50%;
      bottom: 94px;
      max-width: 86%;
      transform: translateX(-50%) translateY(12px);
      border-radius: 999px;
      background: rgba(69, 55, 43, 0.92);
      color: #fff;
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 900;
      opacity: 0;
      pointer-events: none;
      transition: opacity 160ms ease, transform 160ms ease;
      z-index: 8;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-height: 820px) {
      .phone {
        min-height: 680px;
      }

      .rabbit-scene {
        min-height: 205px;
      }

      .feed {
        min-height: 58px;
      }

      .listen-main {
        flex-basis: 180px;
        min-height: 180px;
      }

      .latest-transcript {
        flex-basis: 62px;
        min-height: 62px;
      }

      .revise-screen .listen-main {
        flex-basis: 260px;
        min-height: 260px;
      }

      .listening-rabbit {
        width: 108px;
        height: 108px;
        flex-basis: 108px;
        margin: 10px 0 -4px;
      }

      .listen-title {
        font-size: 22px;
      }
    }

    @media (max-width: 460px) {
      body {
        padding: 0;
        background: linear-gradient(180deg, var(--cream), #f2ffe8);
      }

      .phone {
        width: 100%;
        height: 100vh;
        min-height: 100vh;
        border-radius: 0;
        padding: 0;
        background: transparent;
        box-shadow: none;
      }

      .miniapp {
        border-radius: 0;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="童心日记小程序原型">
    <div class="miniapp">
      <div class="statusbar">
        <span>17:50</span>
        <span>●●● 5G 100%</span>
      </div>
      <div class="nav">
        <span></span>
        <div class="nav-title">童心日记</div>
        <div class="capsule"><span>· ·</span><span>○</span></div>
      </div>

      <div class="content">
        <section class="screen active" data-screen="home">
          <div class="home-hero">
            <div class="rabbit-scene" aria-hidden="true">
              <div class="rabbit">
                <div class="ear left"></div>
                <div class="ear right"></div>
                <div class="head">
                  <span class="eye left"></span>
                  <span class="eye right"></span>
                  <span class="nose"></span>
                  <span class="cheek left"></span>
                  <span class="cheek right"></span>
                </div>
              </div>
            </div>

            <div>
              <h1 class="headline">今天的小故事，直接说给小耳朵听</h1>
              <p class="subcopy">说一句也可以。小耳朵会一边听，一边想还要不要问你。</p>
            </div>

            <div class="theme-card">
              <p class="label">今日主题</p>
              <p class="theme">今天你帮助别人做了什么？</p>
            </div>

            <div class="bottom-action">
              <button class="primary" type="button" data-action="start">开始说</button>
            </div>
          </div>
        </section>

        <section class="screen listen-screen" data-screen="listen">
          <div class="topic-mini">
            <span>今日主题</span>
            <strong>帮助别人</strong>
          </div>

          <div class="listen-main">
            <div class="halo"></div>
            <div class="halo two"></div>
            <div class="rabbit listening-rabbit" aria-hidden="true">
              <div class="ear left"></div>
              <div class="ear right"></div>
              <div class="head">
                <span class="eye left"></span>
                <span class="eye right"></span>
                <span class="nose"></span>
                <span class="cheek left"></span>
                <span class="cheek right"></span>
              </div>
            </div>
            <h2 class="listen-title" id="listenTitle">正在听你说</h2>
            <p class="listen-hint" id="listenHint">你可以说：今天我帮妈妈擦桌子……</p>
            <div class="wave" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="latest-transcript" aria-live="polite">
            <strong>刚刚听到</strong>
            <span id="latestTranscriptText">开始说以后，最新识别的文字会一直显示在这里</span>
          </div>

          <div class="feed" id="feed"></div>
          <div class="live-question" id="liveQuestion" aria-live="polite"></div>
          <div class="facts-strip" id="factsStrip"></div>
          <div class="record-actions">
            <button class="mini-button" id="continueButton" type="button" data-action="continue">我还想说</button>
            <button class="mini-button finish" id="finishButton" type="button" data-action="finish">我说完啦</button>
          </div>
        </section>

        <section class="screen diary-screen" data-screen="diary">
          <div class="read-state" id="readState">
            <span class="spinner"></span>
            <span>小耳朵正在读给你听</span>
          </div>

          <article class="diary-card">
            <p class="label">我的日记</p>
            <h1 id="diaryTitle">我帮妈妈擦桌子</h1>
            <p id="diaryBody"></p>
            <div class="source-panel" id="sourcePanel"></div>
          </article>

          <button class="mini-button orange" type="button" data-action="read">听小耳朵读</button>
          <div class="secondary-row">
            <button class="soft green" type="button" data-action="save">就是这样</button>
            <button class="soft" type="button" data-action="revise">我想改一下</button>
          </div>
        </section>

        <section class="screen listen-screen revise-screen" data-screen="revise">
          <div class="topic-mini">
            <span>语音修改</span>
            <strong>不用打字</strong>
          </div>

          <div class="listen-main">
            <div class="rabbit listening-rabbit" aria-hidden="true">
              <div class="ear left"></div>
              <div class="ear right"></div>
              <div class="head">
                <span class="eye left"></span>
                <span class="eye right"></span>
                <span class="nose"></span>
                <span class="cheek left"></span>
                <span class="cheek right"></span>
              </div>
            </div>
            <h2 class="listen-title" id="revisionTitle">正在打开麦克风</h2>
            <p class="listen-hint" id="revisionHint">直接说哪里要改，也可以补充或删除。</p>
            <div class="wave" aria-hidden="true">
              <span></span><span></span><span></span><span></span><span></span>
            </div>
          </div>

          <div class="feed" id="reviseFeed">
            <div class="bubble ai">小耳朵会只改你说错的事实。</div>
          </div>
          <button class="mini-button orange" id="revisionButton" type="button" data-action="applyRevision">说好了，帮我改</button>
        </section>

        <section class="screen success-screen" data-screen="success">
          <div>
            <div class="success-badge">✓</div>
            <h1 class="headline">保存成功</h1>
            <p class="subcopy">今天的小故事已经放进日记本里啦。</p>
            <div class="bottom-action">
              <button class="primary" type="button" data-action="restart">再讲一篇</button>
            </div>
          </div>
        </section>
      </div>

      <div class="toast" id="toast">已更新</div>
    </div>
  </main>

  <script>
    const screens = document.querySelectorAll(".screen");
    const feed = document.getElementById("feed");
    const factsStrip = document.getElementById("factsStrip");
    const listenTitle = document.getElementById("listenTitle");
    const listenHint = document.getElementById("listenHint");
    const toast = document.getElementById("toast");
    const diaryTitle = document.getElementById("diaryTitle");
    const diaryBody = document.getElementById("diaryBody");
    const sourcePanel = document.getElementById("sourcePanel");
    const readState = document.getElementById("readState");
    const reviseFeed = document.getElementById("reviseFeed");
    const continueButton = document.getElementById("continueButton");
    const finishButton = document.getElementById("finishButton");
    const miniapp = document.querySelector(".miniapp");
    const liveQuestion = document.getElementById("liveQuestion");
    const revisionTitle = document.getElementById("revisionTitle");
    const revisionHint = document.getElementById("revisionHint");
    const revisionButton = document.getElementById("revisionButton");
    const latestTranscriptText = document.getElementById("latestTranscriptText");

    const DEMO_TURNS = {
      initial: {
        kind: "initial",
        text: "今天我帮妈妈擦桌子，然后我的手湿湿的，妈妈说我擦得很干净。",
        facts: [
          { slot: "what", label: "做了什么", text: "我帮妈妈擦桌子", quote: "我帮妈妈擦桌子" },
          { slot: "detail", label: "小细节", text: "我的手湿湿的", quote: "我的手湿湿的" },
          { slot: "result", label: "别人反馈", text: "妈妈说我擦得很干净", quote: "妈妈说我擦得很干净" }
        ]
      },
      feeling: {
        kind: "followup",
        text: "我很开心，因为妈妈夸我了。",
        facts: [
          { slot: "feeling", label: "我的感觉", text: "我很开心，因为妈妈夸我了", quote: "我很开心，因为妈妈夸我了" }
        ]
      },
      extra: {
        kind: "extra",
        text: "我还先用湿抹布擦了一遍。",
        facts: [
          { slot: "detail", label: "补充细节", text: "我先用湿抹布擦了一遍", quote: "我先用湿抹布擦了一遍" }
        ]
      }
    };

    const state = {
      phase: "home",
      sessionToken: 0,
      turnCount: 0,
      followupCount: 0,
      maxFollowups: 6,
      currentQuestion: null,
      suggestedFinish: false,
      isRecording: false,
      recorder: null,
      stream: null,
      chunks: [],
      audioContext: null,
      audioSource: null,
      audioProcessor: null,
      recordedSamples: [],
      recordingSampleRate: 16000,
      recognition: null,
      recognitionStarting: false,
      recognitionRestartTimer: null,
      recordingHealthTimer: null,
      realtimeAsrTimer: null,
      backendAsrInFlight: false,
      realtimeChunkCursor: 0,
      backendTranscript: "",
      recognitionBlocked: false,
      recognitionStartedAt: 0,
      lastRecognitionResultAt: 0,
      lastBrowserRecognitionAt: 0,
      lastAudioActivityAt: 0,
      liveTranscript: "",
      liveInterimTranscript: "",
      finishAfterCurrentTurn: false,
      realtimeTimer: null,
      realtimeAnalyzing: false,
      realtimePendingText: "",
      realtimeLastText: "",
      latestRealtimeText: "",
      realtimeLocalLastText: "",
      realtimeAskedReason: "",
      questionHistory: [],
      lastQuestionTranscriptLength: 0,
      lastRedirectAt: 0,
      hasRecognizedText: false,
      voiceFinishTriggered: false,
      isFinishing: false,
      pendingTurnKind: "initial",
      recordingMode: "story",
      revisionText: "",
      facts: [],
      utterances: [],
      diary: null
    };

    function show(screen) {
      state.phase = screen;
      screens.forEach(item => item.classList.toggle("active", item.dataset.screen === screen));
    }

    function say(text) {
      toast.textContent = text;
      toast.classList.add("show");
      window.setTimeout(() => toast.classList.remove("show"), 1300);
    }

    function wait(ms) {
      return new Promise(resolve => window.setTimeout(resolve, ms));
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function addBubble(type, html) {
      const div = document.createElement("div");
      div.className = `bubble ${type}`;
      div.innerHTML = html;
      feed.appendChild(div);
      feed.scrollTop = feed.scrollHeight;
    }

    function resetSession() {
      state.sessionToken += 1;
      state.turnCount = 0;
      state.followupCount = 0;
      state.currentQuestion = null;
      state.suggestedFinish = false;
      stopRecordingHealthCheck();
      stopRecordingTracks();
      state.isRecording = false;
      state.recorder = null;
      state.chunks = [];
      stopWavRecorder();
      stopSpeechRecognition();
      state.recognition = null;
      state.recognitionStarting = false;
      state.recognitionStartedAt = 0;
      state.lastRecognitionResultAt = 0;
      state.lastBrowserRecognitionAt = 0;
      state.lastAudioActivityAt = 0;
      clearInterval(state.realtimeAsrTimer);
      state.realtimeAsrTimer = null;
      state.backendAsrInFlight = false;
      state.realtimeChunkCursor = 0;
      state.backendTranscript = "";
      state.liveTranscript = "";
      state.liveInterimTranscript = "";
      state.finishAfterCurrentTurn = false;
      clearTimeout(state.realtimeTimer);
      state.realtimeTimer = null;
      state.realtimeAnalyzing = false;
      state.realtimePendingText = "";
      state.realtimeLastText = "";
      state.latestRealtimeText = "";
      state.realtimeLocalLastText = "";
      state.realtimeAskedReason = "";
      state.questionHistory = [];
      state.lastQuestionTranscriptLength = 0;
      state.lastRedirectAt = 0;
      state.hasRecognizedText = false;
      state.voiceFinishTriggered = false;
      state.isFinishing = false;
      state.pendingTurnKind = "initial";
      state.recordingMode = "story";
      state.revisionText = "";
      state.facts = [];
      state.utterances = [];
      state.diary = null;
      feed.innerHTML = "";
      setLiveQuestion(null);
      sourcePanel.innerHTML = "";
      diaryBody.innerHTML = "";
      latestTranscriptText.textContent = "开始说以后，最新识别的文字会一直显示在这里";
      updateRecordButtons();
      renderFacts();
    }

    function addTurn(turn) {
      state.turnCount += 1;
      const source = `第 ${state.turnCount} 次说话`;
      state.utterances.push({ source, text: turn.text, kind: turn.kind });
      addBubble("child", escapeHtml(turn.text));

      const newFacts = turn.facts.map((fact, index) => ({
        id: `f${state.turnCount}_${index + 1}`,
        slot: fact.slot,
        label: fact.label,
        text: fact.text,
        source,
        quote: fact.quote,
        active: true
      }));

      mergeFacts(newFacts);
      return newFacts;
    }

    function buildTurnFromText(text, kind) {
      const fallback = kind === "initial" ? DEMO_TURNS.initial : DEMO_TURNS.feeling;
      const cleanText = String(text || "").trim();
      if (!cleanText) return fallback;

      const facts = extractFacts(cleanText, kind);
      return {
        kind,
        text: cleanText,
        facts: facts.length ? facts : [{
          slot: "raw",
          label: "原话",
          text: cleanText,
          quote: cleanText
        }]
      };
    }

    function extractFacts(text, kind) {
      const facts = [];
      const normalized = text.replace(/\s+/g, "");

      if (/帮.*擦桌子|擦桌子/.test(normalized)) {
        const person = normalized.includes("奶奶") ? "奶奶" : normalized.includes("爸爸") ? "爸爸" : normalized.includes("妈妈") ? "妈妈" : "";
        facts.push({
          slot: "what",
          label: "做了什么",
          text: `我帮${person || "家人"}擦桌子`,
          quote: person ? `帮${person}擦桌子` : "擦桌子"
        });
      }

      if (/去.*(公园|动物园|学校|超市)|公园玩|出去玩|玩了/.test(normalized)) {
        const place = normalized.includes("动物园") ? "动物园" : normalized.includes("公园") ? "公园" : normalized.includes("学校") ? "学校" : normalized.includes("超市") ? "超市" : "";
        facts.push({
          slot: "what",
          label: "做了什么",
          text: place ? `我去了${place}玩` : "我出去玩了",
          quote: place ? `去了${place}玩` : "出去玩了"
        });
      }

      if (/小狗|小猫|长颈鹿|兔子|看到|遇到/.test(normalized)) {
        const animal = normalized.match(/小狗|小猫|长颈鹿|兔子/)?.[0];
        facts.push({
          slot: "detail",
          label: "小细节",
          text: animal ? `我看到了${animal}` : "我看到了有趣的东西",
          quote: animal ? `看到${animal}` : "看到"
        });
      }

      if (/湿|湿湿|抹布|擦了|擦一遍/.test(normalized)) {
        facts.push({
          slot: "detail",
          label: kind === "initial" ? "小细节" : "补充细节",
          text: /抹布/.test(normalized) ? "我用抹布擦桌子" : "我的手湿湿的",
          quote: /抹布/.test(normalized) ? "用抹布擦" : "手湿湿的"
        });
      }

      if (/夸|干净|很棒|很好/.test(normalized)) {
        const person = normalized.includes("奶奶") ? "奶奶" : normalized.includes("爸爸") ? "爸爸" : "妈妈";
        facts.push({
          slot: "result",
          label: "别人反馈",
          text: `${person}说我擦得很干净`,
          quote: `${person}说我擦得很干净`
        });
      }

      if (/开心|高兴|快乐|骄傲|难过|害怕|生气/.test(normalized)) {
        const feeling = normalized.match(/开心|高兴|快乐|骄傲|难过|害怕|生气/)?.[0] || "开心";
        const reason = /夸/.test(normalized) ? "，因为妈妈夸我了" : "";
        facts.push({
          slot: "feeling",
          label: "我的感觉",
          text: `我很${feeling}${reason}`,
          quote: reason ? `我很${feeling}，因为妈妈夸我了` : `我很${feeling}`
        });
      }

      return facts;
    }

    function normalizeTextForRealtime(text) {
      return String(text || "").replace(/\s+/g, "");
    }

    function appendRecognizedText(base, addition) {
      const left = String(base || "").trim();
      const right = String(addition || "").trim();
      if (!left) return right;
      if (!right || left.includes(right)) return left;
      if (right.includes(left)) return right;
      return `${left}，${right}`;
    }

    function realtimeTranscript() {
      const browserText = appendRecognizedText(state.liveTranscript, state.liveInterimTranscript);
      const browserIsFresh = browserText && Date.now() - state.lastBrowserRecognitionAt < 8000;
      if (browserIsFresh) return browserText;
      return state.backendTranscript || browserText;
    }

    function revisionTranscript() {
      const browserFinal = String(state.liveTranscript || "").trim();
      const backendFinal = String(state.backendTranscript || "").trim();
      if (!browserFinal) return backendFinal;
      if (!backendFinal) return browserFinal;
      if (browserFinal.includes(backendFinal)) return browserFinal;
      if (backendFinal.includes(browserFinal)) return backendFinal;
      return browserFinal.length >= backendFinal.length ? browserFinal : backendFinal;
    }

    function transcriptPreview(text, limit = 46) {
      const value = String(text || "").trim();
      return value.length > limit ? `…${value.slice(-limit)}` : value;
    }

    function showRecognizedText(text) {
      const preview = transcriptPreview(text);
      state.hasRecognizedText = Boolean(preview);
      if (state.recordingMode === "revision") {
        revisionTitle.textContent = "正在听你修改";
        revisionHint.textContent = `我听到：${preview}`;
      } else {
        latestTranscriptText.textContent = preview || "正在等待你说话";
      }
    }

    function normalizeFactText(text) {
      return String(text || "")
        .replace(/[，。！？、,.!?；;：:\s]/g, "")
        .replace(/^(今天|然后|后来|接着|最后|我|我们)+/g, "");
    }

    function textBigrams(text) {
      const value = normalizeFactText(text);
      const grams = new Set();
      for (let index = 0; index < value.length - 1; index += 1) grams.add(value.slice(index, index + 2));
      return grams;
    }

    function factsOverlap(left, right) {
      const a = normalizeFactText(left);
      const b = normalizeFactText(right);
      if (!a || !b) return false;
      if (a.includes(b) || b.includes(a)) return Math.min(a.length, b.length) >= 5;
      const aGrams = textBigrams(a);
      const bGrams = textBigrams(b);
      if (!aGrams.size || !bGrams.size) return false;
      let shared = 0;
      for (const gram of aGrams) if (bGrams.has(gram)) shared += 1;
      return (2 * shared) / (aGrams.size + bGrams.size) >= 0.72;
    }

    function isNegatedFact(text) {
      return /(没有|没能|没去|没做|没看|没读|不是|不再|不会)/.test(String(text || ""));
    }

    function sharesSpecificPhrase(left, right) {
      const ignored = new Set(["今天", "然后", "后来", "我们", "之后", "开始", "一起", "回家"]);
      const leftGrams = textBigrams(String(left || "").replace(/没有|没能|没去|没做|没看|没读|不是|不再|不会/g, ""));
      const rightGrams = textBigrams(String(right || "").replace(/没有|没能|没去|没做|没看|没读|不是|不再|不会/g, ""));
      for (const gram of leftGrams) {
        if (!ignored.has(gram) && rightGrams.has(gram)) return true;
      }
      return false;
    }

    function pruneActiveFactDuplicates() {
      const facts = activeFacts();
      for (let index = 0; index < facts.length; index += 1) {
        for (let otherIndex = index + 1; otherIndex < facts.length; otherIndex += 1) {
          if (facts[otherIndex].active && factsOverlap(facts[index].text, facts[otherIndex].text)) {
            facts[otherIndex].active = false;
          }
        }
      }
    }

    function mergeFacts(newFacts) {
      for (const fact of newFacts) {
        const duplicate = state.facts.find(existing => existing.active && factsOverlap(existing.text, fact.text));
        if (!duplicate) state.facts.push(fact);
      }
      renderFacts();
    }

    function activeFacts() {
      return state.facts.filter(fact => fact.active);
    }

    function factsBySlot(slot) {
      return activeFacts().filter(fact => fact.slot === slot);
    }

    function hasSlot(slot) {
      return factsBySlot(slot).length > 0;
    }

    function renderFacts() {
      const facts = activeFacts();
      if (!facts.length) {
        factsStrip.innerHTML = "";
        return;
      }
      factsStrip.innerHTML = facts
        .map(fact => `<div class="chip">${escapeHtml(fact.label)}：${escapeHtml(fact.text)}</div>`)
        .join("");
    }

    function setLiveQuestion(decision) {
      if (!liveQuestion) return;
      const question = String(decision?.question || "").trim();
      const previousQuestion = String(state.currentQuestion?.question || "").trim();
      state.currentQuestion = question
        ? { ...decision, transcriptSnapshot: normalizeTextForRealtime(state.latestRealtimeText) }
        : null;
      liveQuestion.textContent = "";
      liveQuestion.classList.remove("show");
      if (question) {
        listenTitle.textContent = "小耳朵边听边问";
        if (question !== previousQuestion) addBubble("ai", escapeHtml(question));
      }
    }

    function mergeRealtimeFacts(facts, sourceText) {
      const source = "实时识别";
      const newFacts = (facts || [])
        .filter(fact => fact && fact.slot && fact.text && fact.slot !== "raw")
        .map((fact, index) => ({
          id: `rt_${Date.now()}_${index}`,
          slot: fact.slot,
          label: fact.label || fact.slot,
          text: fact.text,
          source,
          quote: fact.quote || sourceText,
          active: true
        }));
      let added = 0;
      for (const fact of newFacts) {
        const duplicate = state.facts.find(existing =>
          existing.active && existing.slot === fact.slot &&
          (factsOverlap(existing.text, fact.text) || existing.quote === fact.quote)
        );
        if (duplicate) continue;
        state.facts.push(fact);
        added += 1;
      }
      if (added) renderFacts();
      return added;
    }

    function scheduleRealtimeAnalyze(text, kind) {
      const normalized = normalizeTextForRealtime(text);
      state.latestRealtimeText = text;
      if (normalized.length < 6) return;
      if (normalized === state.realtimeLastText) return;
      clearTimeout(state.realtimeTimer);
      state.realtimeTimer = window.setTimeout(() => {
        analyzeRealtimeText(text, kind);
      }, 700);
    }

    async function analyzeRealtimeText(text, kind) {
      const normalized = normalizeTextForRealtime(text);
      if (!state.isRecording || normalized === state.realtimeLastText) return;
      if (state.realtimeAnalyzing) {
        state.realtimePendingText = text;
        return;
      }
      state.realtimeAnalyzing = true;
      const previousNormalized = state.realtimeLastText;
      state.realtimeLastText = normalized;
      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            kind,
            existingFacts: activeFacts().map(({ slot, label, text, quote }) => ({ slot, label, text, quote })),
            followupCount: state.followupCount,
            maxFollowups: state.maxFollowups,
            currentQuestion: state.currentQuestion
              ? { reason: state.currentQuestion.reason, question: state.currentQuestion.question }
              : null,
            answerTextSinceQuestion: getAnswerTextSinceQuestion(text),
            previousQuestions: state.questionHistory,
            recentText: previousNormalized && normalized.startsWith(previousNormalized)
              ? normalized.slice(previousNormalized.length)
              : text,
            realtime: true
          })
        });
        if (!response.ok) throw new Error(`realtime analyze ${response.status}`);
        const data = await response.json();
        mergeRealtimeFacts(data.facts, text);
        const decision = data.decision;
        const question = String(decision?.question || "").trim();
        const isNewQuestion = question && !state.questionHistory.includes(question);
        const enoughNewSpeech = state.followupCount === 0 || normalized.length - state.lastQuestionTranscriptLength >= 14;
        if (decision?.action === "redirect") {
          const now = Date.now();
          if (now - state.lastRedirectAt > 8000) {
            state.lastRedirectAt = now;
            addBubble("ai", escapeHtml(question || "我们回到今天的小故事吧，你刚才和谁一起做了什么呀？"));
          }
          listenTitle.textContent = "我们继续讲小故事吧";
          if (!state.hasRecognizedText) listenHint.textContent = "直接继续讲真实发生的事就好。";
        } else if (decision?.action === "ask_followup" && isNewQuestion && enoughNewSpeech && state.followupCount < state.maxFollowups) {
          state.realtimeAskedReason = decision.reason || question;
          state.followupCount += 1;
          state.questionHistory.push(question);
          state.lastQuestionTranscriptLength = normalized.length;
          setLiveQuestion(decision);
          if (!state.hasRecognizedText) listenHint.textContent = "你可以直接继续说，不用先点按钮。";
        } else if (decision?.action === "suggest_finish") {
          listenTitle.textContent = "正在听你说";
          if (!state.hasRecognizedText) listenHint.textContent = "还想补充哪个问题都可以，全部说完再点“我说完啦”。";
        }
      } catch (error) {
        // 实时分析失败不打断录音，结束本句时还会再分析一次。
      } finally {
        state.realtimeAnalyzing = false;
        const pending = state.realtimePendingText;
        state.realtimePendingText = "";
        if (pending && normalizeTextForRealtime(pending) !== state.realtimeLastText && state.isRecording) {
          window.setTimeout(() => analyzeRealtimeText(pending, kind), 120);
        }
      }
    }

    function getAnswerTextSinceQuestion(text) {
      if (!state.currentQuestion) return "";
      const current = normalizeTextForRealtime(text);
      const snapshot = String(state.currentQuestion.transcriptSnapshot || "");
      if (!snapshot) return current;
      return current.startsWith(snapshot) ? current.slice(snapshot.length) : current;
    }

    function updateRecordButtons() {
      if (!continueButton || !finishButton) return;
      if (miniapp) miniapp.classList.toggle("recording", state.isRecording);
      if (state.isFinishing) {
        continueButton.disabled = true;
        finishButton.disabled = true;
        continueButton.textContent = "正在整理";
        finishButton.textContent = "请稍等";
        return;
      }
      if (state.isRecording) {
        continueButton.textContent = "继续说就好";
        continueButton.disabled = true;
        finishButton.textContent = "我说完啦";
        return;
      }
      continueButton.disabled = false;
      finishButton.disabled = false;
      continueButton.textContent = state.utterances.length ? "我还想说" : "开始收音";
      finishButton.textContent = "我说完啦";
    }

    function stopRecordingTracks() {
      if (state.stream) {
        state.stream.getTracks().forEach(track => track.stop());
        state.stream = null;
      }
    }

    function startWavRecorder(stream, options = {}) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      state.audioContext = new AudioContext();
      state.recordingSampleRate = state.audioContext.sampleRate || 48000;
      if (!options.preserveSamples) state.recordedSamples = [];
      state.audioSource = state.audioContext.createMediaStreamSource(stream);
      state.audioProcessor = state.audioContext.createScriptProcessor(4096, 1, 1);
      state.audioProcessor.onaudioprocess = event => {
        if (!state.isRecording) return;
        const input = event.inputBuffer.getChannelData(0);
        state.recordedSamples.push(new Float32Array(input));
        let energy = 0;
        for (let index = 0; index < input.length; index += 1) energy += input[index] * input[index];
        if (Math.sqrt(energy / input.length) > 0.012) state.lastAudioActivityAt = Date.now();
      };
      state.audioSource.connect(state.audioProcessor);
      state.audioProcessor.connect(state.audioContext.destination);
    }

    function stopWavRecorder(options = {}) {
      if (state.audioProcessor) {
        state.audioProcessor.disconnect();
        state.audioProcessor.onaudioprocess = null;
        state.audioProcessor = null;
      }
      if (state.audioSource) {
        state.audioSource.disconnect();
        state.audioSource = null;
      }
      if (state.audioContext) {
        state.audioContext.close().catch(() => {});
        state.audioContext = null;
      }

      if (options.preserveSamples) return null;

      const samples = mergeSamples(state.recordedSamples);
      state.recordedSamples = [];
      if (!samples.length) return null;
      const pcm16k = downsampleBuffer(samples, state.recordingSampleRate, 16000);
      return encodeWav(pcm16k, 16000);
    }

    function mergeSamples(chunks) {
      const length = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
      const result = new Float32Array(length);
      let offset = 0;
      for (const chunk of chunks) {
        result.set(chunk, offset);
        offset += chunk.length;
      }
      return result;
    }

    function downsampleBuffer(buffer, inputRate, outputRate) {
      if (outputRate === inputRate) return buffer;
      const ratio = inputRate / outputRate;
      const newLength = Math.round(buffer.length / ratio);
      const result = new Float32Array(newLength);
      let offsetResult = 0;
      let offsetBuffer = 0;
      while (offsetResult < result.length) {
        const nextOffsetBuffer = Math.round((offsetResult + 1) * ratio);
        let accum = 0;
        let count = 0;
        for (let i = offsetBuffer; i < nextOffsetBuffer && i < buffer.length; i += 1) {
          accum += buffer[i];
          count += 1;
        }
        result[offsetResult] = count ? accum / count : 0;
        offsetResult += 1;
        offsetBuffer = nextOffsetBuffer;
      }
      return result;
    }

    function encodeWav(samples, sampleRate) {
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      writeString(view, 0, "RIFF");
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, "WAVE");
      writeString(view, 12, "fmt ");
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(view, 36, "data");
      view.setUint32(40, samples.length * 2, true);
      let offset = 44;
      for (let i = 0; i < samples.length; i += 1, offset += 2) {
        const sample = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
      }
      return new Blob([view], { type: "audio/wav" });
    }

    function writeString(view, offset, string) {
      for (let i = 0; i < string.length; i += 1) {
        view.setUint8(offset + i, string.charCodeAt(i));
      }
    }

    function startSpeechRecognition(options = {}) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!options.preserveTranscript) {
        state.liveTranscript = "";
        state.liveInterimTranscript = "";
      }
      if (!SpeechRecognition) return false;
      if (state.recognitionBlocked || !state.isRecording) return false;
      if (state.recognition || state.recognitionStarting) return true;

      try {
        state.recognitionStarting = true;
        const recognition = new SpeechRecognition();
        recognition.lang = "zh-CN";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = event => {
          state.lastRecognitionResultAt = Date.now();
          state.lastBrowserRecognitionAt = Date.now();
          let finalText = "";
          let interimText = "";
          for (let index = event.resultIndex; index < event.results.length; index += 1) {
            const text = event.results[index][0]?.transcript || "";
            if (event.results[index].isFinal) finalText += text;
            else interimText += text;
          }
          const separator = state.liveTranscript && finalText ? "，" : "";
          const merged = `${state.liveTranscript}${separator}${finalText}`.trim();
          if (finalText) state.liveTranscript = merged;
          state.liveInterimTranscript = interimText.trim();
          const preview = realtimeTranscript();
          if (preview) {
            if (state.recordingMode === "revision") {
              const confirmedRevision = revisionTranscript();
              if (confirmedRevision) showRecognizedText(confirmedRevision);
              else revisionHint.textContent = "正在听，请把这句话说完整。";
            } else {
              showRecognizedText(preview);
              scheduleRealtimeAnalyze(preview, state.pendingTurnKind);
              maybeFinishByVoice(preview);
            }
          }
        };
        recognition.onerror = event => {
          if (["not-allowed", "service-not-allowed"].includes(event.error)) {
            state.recognitionBlocked = true;
            const hint = "实时字幕暂时不可用，录音仍在继续，结束后会完整识别。";
            if (state.recordingMode === "revision") revisionHint.textContent = hint;
            else listenHint.textContent = hint;
          }
        };
        recognition.onend = () => {
          if (state.recognition === recognition) state.recognition = null;
          state.recognitionStarting = false;
          if (!state.isRecording || state.voiceFinishTriggered) return;
          clearTimeout(state.recognitionRestartTimer);
          state.recognitionRestartTimer = window.setTimeout(() => {
            if (!state.isRecording || state.voiceFinishTriggered || state.recognition) return;
            startSpeechRecognition({ preserveTranscript: true });
          }, 260);
        };
        recognition.start();
        state.recognition = recognition;
        state.recognitionStarting = false;
        state.recognitionStartedAt = Date.now();
        return true;
      } catch {
        state.recognition = null;
        state.recognitionStarting = false;
        return false;
      }
    }

    function forceRestartSpeechRecognition() {
      if (!state.isRecording || state.recognitionBlocked || state.voiceFinishTriggered) return;
      if (state.liveInterimTranscript) {
        const separator = state.liveTranscript ? "，" : "";
        state.liveTranscript = `${state.liveTranscript}${separator}${state.liveInterimTranscript}`.trim();
        state.liveInterimTranscript = "";
      }
      clearTimeout(state.recognitionRestartTimer);
      state.recognitionRestartTimer = null;
      const recognition = state.recognition;
      state.recognition = null;
      state.recognitionStarting = false;
      if (recognition) {
        recognition.onend = null;
        try {
          recognition.abort();
        } catch {}
      }
      window.setTimeout(() => startSpeechRecognition({ preserveTranscript: true }), 180);
    }

    function stopSpeechRecognition() {
      clearTimeout(state.recognitionRestartTimer);
      state.recognitionRestartTimer = null;
      state.recognitionStarting = false;
      if (state.recognition) {
        const recognition = state.recognition;
        state.recognition = null;
        recognition.onend = null;
        try {
          recognition.stop();
        } catch {}
      }
    }

    function startRecordingHealthCheck() {
      clearInterval(state.recordingHealthTimer);
      state.recordingHealthTimer = window.setInterval(async () => {
        if (!state.isRecording) return;
        const track = state.stream?.getAudioTracks?.()[0];
        if ((!track || track.readyState === "ended") && !state.voiceFinishTriggered) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stopWavRecorder({ preserveSamples: true });
            stopRecordingTracks();
            state.stream = stream;
            startWavRecorder(stream, { preserveSamples: true });
          } catch {
            const hint = "麦克风连接中断了，请检查权限后再试。";
            if (state.recordingMode === "revision") revisionHint.textContent = hint;
            else listenHint.textContent = hint;
          }
        }
        if (!state.recognition && !state.recognitionBlocked && !state.voiceFinishTriggered) {
          startSpeechRecognition({ preserveTranscript: true });
        }
        const now = Date.now();
        const recognitionHeartbeat = Math.max(state.recognitionStartedAt, state.lastRecognitionResultAt);
        const heardVoiceRecently = now - state.lastAudioActivityAt < 2400;
        const recognitionIsStuck = state.recognition && recognitionHeartbeat && now - recognitionHeartbeat > 6500;
        if (heardVoiceRecently && recognitionIsStuck) forceRestartSpeechRecognition();
      }, 1800);
    }

    function startRealtimeBackendAsr() {
      clearInterval(state.realtimeAsrTimer);
      state.realtimeChunkCursor = 0;
      state.realtimeAsrTimer = window.setInterval(uploadRealtimeAudioChunk, 6200);
    }

    function stopRealtimeBackendAsr() {
      clearInterval(state.realtimeAsrTimer);
      state.realtimeAsrTimer = null;
    }

    async function uploadRealtimeAudioChunk() {
      if (!state.isRecording || state.backendAsrInFlight) return;
      const end = state.recordedSamples.length;
      const chunks = state.recordedSamples.slice(state.realtimeChunkCursor, end);
      if (!chunks.length) return;
      state.realtimeChunkCursor = end;
      const samples = mergeSamples(chunks);
      if (samples.length < state.recordingSampleRate * 1.2) return;
      const pcm16k = downsampleBuffer(samples, state.recordingSampleRate, 16000);
      const blob = encodeWav(pcm16k, 16000);
      state.backendAsrInFlight = true;
      try {
        const form = new FormData();
        form.append("audio", blob, `live-${Date.now()}.wav`);
        form.append("kind", state.pendingTurnKind);
        form.append("realtime", "1");
        const response = await fetch("/api/asr", { method: "POST", body: form });
        if (!response.ok) return;
        const data = await response.json();
        const text = data.provider === "mock" ? "" : String(data.text || "").trim();
        if (!text || !state.isRecording) return;
        state.backendTranscript = appendRecognizedText(state.backendTranscript, text);
        const preview = realtimeTranscript();
        if (state.recordingMode === "revision") {
          const confirmedRevision = revisionTranscript();
          if (confirmedRevision) showRecognizedText(confirmedRevision);
        } else {
          showRecognizedText(preview);
          scheduleRealtimeAnalyze(preview, state.pendingTurnKind);
          maybeFinishByVoice(preview);
        }
      } catch {
        // 浏览器实时识别仍会继续；结束时还会用整段录音复核。
      } finally {
        state.backendAsrInFlight = false;
      }
    }

    function stopRecordingHealthCheck() {
      clearInterval(state.recordingHealthTimer);
      state.recordingHealthTimer = null;
    }

    function resumeRecognitionAfterFocus() {
      if (state.isRecording && !state.recognition && !state.recognitionBlocked) {
        startSpeechRecognition({ preserveTranscript: true });
      }
    }

    window.addEventListener("focus", resumeRecognitionAfterFocus);
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) resumeRecognitionAfterFocus();
    });

    function maybeFinishByVoice(text) {
      const normalized = normalizeTextForRealtime(text);
      if (state.voiceFinishTriggered) return;
      if (!/(我)?说完(了|啦)?|讲完(了|啦)?|结束(了)?/.test(normalized)) return;
      state.voiceFinishTriggered = true;
      say("听到你说完了，正在整理");
      finishSpeaking();
    }

    async function beginRecording(kind) {
      state.recordingMode = "story";
      state.pendingTurnKind = kind;
      if (!navigator.mediaDevices?.getUserMedia) {
        say("当前浏览器不支持录音，请用最新版 Chrome 打开");
        listenTitle.textContent = "这个浏览器不能录音";
        listenHint.textContent = "请用最新版 Chrome，并通过测试地址打开。";
        return;
      }

      try {
        state.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.isRecording = true;
        state.recognitionBlocked = false;
      state.lastAudioActivityAt = Date.now();
      state.lastRecognitionResultAt = Date.now();
      state.lastBrowserRecognitionAt = 0;
        startWavRecorder(state.stream);
        const hasBrowserAsr = startSpeechRecognition();
        state.recorder = { type: "wav" };
        startRecordingHealthCheck();
        startRealtimeBackendAsr();
        updateRecordButtons();
        listenTitle.textContent = kind === "initial" ? "正在听你说" : "正在听你的补充";
        listenHint.textContent = hasBrowserAsr
          ? "一直说就好，小耳朵会边听边问。全部说完再点“我说完啦”。"
          : "正在录音。当前浏览器没有实时识别，会交给后端音转文。";
        say(hasBrowserAsr ? "开始收音和实时识别" : "开始收音");
        if (!feed.children.length) addBubble("system", "正在持续收音，看到问题后直接继续说就好");
      } catch (error) {
        stopRecordingTracks();
        stopSpeechRecognition();
        state.isRecording = false;
        updateRecordButtons();
        say("麦克风不可用，请检查浏览器权限");
        listenTitle.textContent = "没有拿到麦克风权限";
        listenHint.textContent = "请允许麦克风后，再点“开始收音”。";
      }
    }

    function stopAndProcessRecording(options = {}) {
      if (!state.isRecording || !state.recorder) return false;
      state.finishAfterCurrentTurn = Boolean(options.finishAfter);
      state.isRecording = false;
      stopRecordingHealthCheck();
      stopRealtimeBackendAsr();
      updateRecordButtons();
      listenTitle.textContent = "小耳朵在后台转文字";
      listenHint.textContent = state.liveTranscript || state.liveInterimTranscript
        ? "正在使用刚才听到的文字。"
        : "正在上传音频并识别。";
      stopSpeechRecognition();
      const blob = stopWavRecorder();
      stopRecordingTracks();
      state.recorder = null;
      processAudioBlob(blob, state.pendingTurnKind);
      return true;
    }

    async function processAudioBlob(blob, kind) {
      const shouldFinishAfter = state.finishAfterCurrentTurn;
      state.finishAfterCurrentTurn = false;
      const browserText = realtimeTranscript();
      state.liveTranscript = "";
      state.liveInterimTranscript = "";
      state.backendTranscript = "";
      state.hasRecognizedText = false;

      if (!blob || blob.size < 800) {
        if (!browserText) {
          say("这次没有听清，请再说一次");
          if (shouldFinishAfter) cancelFinish();
          return;
        }
        await processRecognizedText(browserText, kind, null, { skipAnalysis: shouldFinishAfter });
        if (shouldFinishAfter) await completeFinishSpeaking();
        return;
      }

      try {
        const form = new FormData();
        form.append("audio", blob, `turn-${Date.now()}.webm`);
        form.append("kind", kind);
        form.append("turnIndex", String(state.turnCount + 1));

        const response = await fetch("/api/asr", { method: "POST", body: form });
        if (!response.ok) throw new Error(`ASR ${response.status}`);
        const data = await response.json();
        const text = String(data.text || browserText).trim();
        if (data.provider === "mock") addBubble("system", "当前未配置真实 ASR，后端返回模拟识别文本");
        if (!text) {
          say("这次没有听清，请再说一次");
          listenTitle.textContent = "刚才没有听清";
          listenHint.textContent = "点“开始收音”再说一次吧。";
          if (shouldFinishAfter) cancelFinish();
          return;
        }
        await processRecognizedText(text, kind, null, { skipAnalysis: shouldFinishAfter });
        if (shouldFinishAfter) await completeFinishSpeaking();
      } catch (error) {
        if (!browserText) {
          addBubble("system", "音转文暂时不可用，这次没有生成预设文字");
          say("音转文暂时不可用");
          if (shouldFinishAfter) cancelFinish();
          return;
        }
        addBubble("system", "后端音转文暂时不可用，已保留实时识别文字");
        await processRecognizedText(browserText, kind, null, { skipAnalysis: shouldFinishAfter });
        if (shouldFinishAfter) await completeFinishSpeaking();
      }
    }

    async function processFallbackTurn(kind, options = {}) {
      const fallback = kind === "initial"
        ? DEMO_TURNS.initial
        : state.currentQuestion?.reason === "missing_detail"
          ? DEMO_TURNS.extra
          : DEMO_TURNS.feeling;
      await processRecognizedText(fallback.text, kind, fallback, options);
    }

    async function analyzeTurnWithModel(text, kind) {
      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text,
            kind,
            existingFacts: activeFacts().map(({ slot, label, text, quote }) => ({ slot, label, text, quote })),
            followupCount: state.followupCount,
            maxFollowups: state.maxFollowups
          })
        });
        if (!response.ok) throw new Error(`analyze ${response.status}`);
        const data = await response.json();
        if (data.provider === "qwen") addBubble("system", "通义千问已完成事实抽取和追问判断");
        return {
          turn: {
            kind,
            text,
            facts: Array.isArray(data.facts) && data.facts.length ? data.facts : buildTurnFromText(text, kind).facts
          },
          decision: data.decision || null
        };
      } catch (error) {
        addBubble("system", "千问分析暂时不可用，已使用本地规则判断");
        return {
          turn: buildTurnFromText(text, kind),
          decision: null
        };
      }
    }

    async function processRecognizedText(text, kind, explicitTurn = null, options = {}) {
      const token = state.sessionToken;
      const analyzed = explicitTurn
        ? { turn: explicitTurn, decision: null }
        : await analyzeTurnWithModel(text, kind);
      const turn = analyzed.turn;
      if (turn.facts.every(fact => fact.slot === "raw") && activeFacts().some(fact => fact.slot === "what")) {
        turn.facts = [];
      }
      addTurn(turn);
      await wait(420);
      if (token !== state.sessionToken) return;
      if (options.skipAnalysis) return;
      if (analyzed.decision) {
        applyDecision(analyzed.decision);
        return;
      }
      runAnalysis(token);
    }

    function applyDecision(decision) {
      if (decision.action === "ask_followup") {
        state.followupCount += 1;
        state.currentQuestion = decision;
        state.suggestedFinish = false;
        addBubble("ai", escapeHtml(decision.question || "你能再多说一点点吗？"));
        listenTitle.textContent = "小耳朵想问一句";
        listenHint.textContent = "如果还想补充，点“我还想说”；说完了也可以点“我说完啦”。";
        return;
      }

      state.currentQuestion = null;
      state.suggestedFinish = true;
      listenTitle.textContent = "故事已经完整啦";
      listenHint.textContent = "小耳朵不会自己结束，等你点“我说完啦”。";
      addBubble("system", "故事已经够完整啦，可以点“我说完啦”。");
    }

    function analyzeNextAction() {
      if (!hasSlot("what")) {
        if (hasSlot("raw")) {
          return { action: "retry_asr", message: "小耳朵听到了你的话，但还没听清楚你做了什么。可以再补一句“我做了什么”。" };
        }
        return { action: "retry_asr", message: "小耳朵还没听清你做了什么，我们再说一点点。" };
      }

      const richSlots = ["detail", "feeling", "result"].filter(hasSlot);
      const canCompose = richSlots.length >= 2 || state.followupCount >= state.maxFollowups;

      if (!hasSlot("detail") && state.followupCount < state.maxFollowups) {
        return { action: "ask_followup", reason: "missing_detail", question: "你是怎么做的呀？" };
      }
      if (!hasSlot("feeling") && state.followupCount < state.maxFollowups) {
        return { action: "ask_followup", reason: "missing_feeling", question: "做完这件事的时候，你是什么感觉呀？" };
      }
      if (!hasSlot("result") && state.followupCount < state.maxFollowups) {
        return { action: "ask_followup", reason: "missing_result", question: "后来发生了什么呀？" };
      }
      if (canCompose) {
        return { action: "suggest_finish", message: "故事已经够完整啦，可以点“我说完啦”。" };
      }
      return { action: "suggest_finish", message: "可以先生成一篇短日记，也可以继续补充。" };
    }

    async function runAnalysis(token) {
      if (token !== state.sessionToken) return;
      listenTitle.textContent = "小耳朵在后台整理";
      listenHint.textContent = "正在识别文字、提取事实、判断还缺什么。";
      addBubble("system", "已识别文字，正在找你说过的小事实");
      await wait(520);
      if (token !== state.sessionToken) return;

      const facts = activeFacts();
      addBubble("system", `已听到 ${facts.length} 个事实`);
      const decision = analyzeNextAction();
      await wait(620);
      if (token !== state.sessionToken) return;

      if (decision.action === "ask_followup") {
        state.followupCount += 1;
        state.currentQuestion = decision;
        state.suggestedFinish = false;
        addBubble("ai", escapeHtml(decision.question));
        listenTitle.textContent = "小耳朵想问一句";
        listenHint.textContent = "如果还想补充，点“我还想说”；说完了也可以点“我说完啦”。";
        return;
      }

      if (decision.action === "retry_asr") {
        state.currentQuestion = null;
        listenTitle.textContent = "刚才没听清";
        listenHint.textContent = "再多说一点点，好吗？";
        addBubble("system", escapeHtml(decision.message));
        return;
      }

      state.currentQuestion = null;
      state.suggestedFinish = true;
      listenTitle.textContent = "故事已经完整啦";
      listenHint.textContent = "小耳朵不会自己结束，等你点“我说完啦”。";
      addBubble("system", escapeHtml(decision.message));
    }

    async function startFlow() {
      resetSession();
      listenTitle.textContent = "正在听你说";
      listenHint.textContent = "你可以慢慢说，小耳朵会在后台转文字。";
      show("listen");
      await beginRecording("initial");
    }

    async function continueFlow() {
      if (state.isRecording) {
        say("不用点这里，直接继续说就好");
        listenTitle.textContent = "正在听你说";
        const transcript = realtimeTranscript();
        if (transcript) showRecognizedText(transcript);
        else listenHint.textContent = "小耳朵正在持续收音。";
        return;
      }

      if (!state.utterances.length) {
        await beginRecording("initial");
        return;
      }

      const kind = state.currentQuestion ? "followup" : "extra";
      await beginRecording(kind);
    }

    async function finishSpeaking() {
      if (state.phase !== "listen" || state.isFinishing) return;
      if (stopAndProcessRecording({ finishAfter: true })) {
        state.isFinishing = true;
        updateRecordButtons();
        say("正在识别并整理");
        return;
      }

      if (!state.utterances.length) {
        say("先说一点点故事吧");
        listenTitle.textContent = "还没听到故事";
        listenHint.textContent = "可以点“开始收音”，先说一句。";
        return;
      }

      state.isFinishing = true;
      updateRecordButtons();
      await completeFinishSpeaking();
    }

    function cancelFinish() {
      state.isFinishing = false;
      state.voiceFinishTriggered = false;
      updateRecordButtons();
    }

    async function completeFinishSpeaking() {
      if (state.phase !== "listen") return;

      state.currentQuestion = null;
      setLiveQuestion(null);
      listenTitle.textContent = "正在整理日记";
      listenHint.textContent = "小耳朵会检查：没有说过的事情不写进去。";
      addBubble("system", "收到“我说完啦”，停止本轮收音");
      await wait(520);
      addBubble("system", "正在生成日记，并检查有没有偷偷加没说过的内容");
      await wait(760);

      const diary = await composeDiaryWithModel();
      const validation = validateDiary(diary);
      if (!validation.ok) {
        addBubble("system", "事实校验没有通过，先不展示这版日记");
        say("日记里有没说过的内容");
        cancelFinish();
        return;
      }

      state.diary = diary;
      renderDiary(diary, validation);
      show("diary");
    }

    function primaryFact(slot) {
      return factsBySlot(slot)[0] || null;
    }

    function composeDiary() {
      const what = primaryFact("what");
      const details = factsBySlot("detail");
      const result = primaryFact("result");
      const feeling = primaryFact("feeling");
      const sentences = [];

      if (what) {
        sentences.push({
          text: `今天${what.text}。`,
          factIds: [what.id],
          mark: "a"
        });
      }

      if (details.length || result) {
        const parts = [];
        const ids = [];
        if (details.length) {
          parts.push(details.map(fact => fact.text).join("，"));
          ids.push(...details.map(fact => fact.id));
        }
        if (result) {
          parts.push(result.text);
          ids.push(result.id);
        }
        sentences.push({
          text: `${parts.join("，")}。`,
          factIds: ids,
          mark: "b"
        });
      }

      if (feeling) {
        sentences.push({
          text: `${feeling.text}。`,
          factIds: [feeling.id],
          mark: "c"
        });
      }

      return {
        title: what ? what.text : "我的日记",
        sentences
      };
    }

    async function composeDiaryWithModel() {
      try {
        const facts = activeFacts()
          .filter(fact => ["what", "detail", "result", "feeling"].includes(fact.slot))
          .map(({ slot, label, text, quote, id }) => ({ slot, label, text, quote, id }));
        const response = await fetch("/api/compose", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            facts,
            utterances: state.utterances.map(item => item.text)
          })
        });
        if (!response.ok) throw new Error(`compose ${response.status}`);
        const data = await response.json();
        if (data.provider === "qwen") addBubble("system", "通义千问已完成事实约束成文");
        return mapModelDiaryToFactIds(data);
      } catch (error) {
        addBubble("system", "千问成文暂时不可用，已使用本地成文");
        return composeDiary();
      }
    }

    function mapModelDiaryToFactIds(data) {
      const facts = activeFacts();
      const title = data.title || facts.find(f => f.slot === "what")?.text || "我的日记";
      const sentences = Array.isArray(data.sentences) ? data.sentences : [];
      const marks = ["a", "b", "c"];
      const mapped = sentences.map((sentence, index) => {
        const factTexts = Array.isArray(sentence.factTexts) ? sentence.factTexts : [];
        let factIds = facts
          .filter(fact => factTexts.includes(fact.text) || factTexts.some(text => fact.text.includes(text) || text.includes(fact.text)))
          .map(fact => fact.id);
        if (!factIds.length) {
          factIds = facts
            .filter(fact => String(sentence.text || "").includes(fact.text))
            .map(fact => fact.id);
        }
        return {
          text: sentence.text || "",
          factIds,
          mark: marks[index % marks.length]
        };
      }).filter(sentence => sentence.text && sentence.factIds.length);

      return mapped.length ? { title, sentences: mapped } : composeDiary();
    }

    function validateDiary(diary) {
      const activeIds = new Set(activeFacts().map(fact => fact.id));
      const missing = [];
      for (const sentence of diary.sentences) {
        for (const id of sentence.factIds) {
          if (!activeIds.has(id)) missing.push(id);
        }
      }
      return { ok: missing.length === 0, missing };
    }

    function renderDiary(diary, validation) {
      diaryTitle.textContent = diary.title;
      diaryBody.innerHTML = diary.sentences
        .map(sentence => `<span class="mark ${sentence.mark}">${escapeHtml(sentence.text)}</span>`)
        .join("");

      const factMap = new Map(activeFacts().map(fact => [fact.id, fact]));
      const sourceRows = diary.sentences.map(sentence => {
        const facts = sentence.factIds.map(id => factMap.get(id)).filter(Boolean);
        const sourceText = facts
          .map(fact => `${fact.source}：“${fact.quote}”`)
          .join("；");
        return `<div class="source"><strong>${escapeHtml(sentence.text)}</strong>${escapeHtml(sourceText)}</div>`;
      });

      if (!hasSlot("feeling")) {
        sourceRows.push(`<div class="source warn"><strong>没有写心情</strong>因为孩子还没有说自己的感觉，MVP 不自动补。</div>`);
      }

      sourceRows.push(
        validation.ok
          ? `<div class="source pass"><strong>事实校验通过</strong>日记里的每句话都能找到孩子说过的来源。</div>`
          : `<div class="source warn"><strong>事实校验失败</strong>发现未授权事实，不能保存。</div>`
      );

      sourcePanel.innerHTML = sourceRows.join("");
    }

    async function startRevisionFlow() {
      if (!state.diary) {
        say("先生成日记再修改");
        return;
      }

      show("revise");
      stopRecordingHealthCheck();
      stopRealtimeBackendAsr();
      stopSpeechRecognition();
      stopWavRecorder();
      stopRecordingTracks();
      state.recordingMode = "revision";
      state.pendingTurnKind = "revision";
      state.liveTranscript = "";
      state.liveInterimTranscript = "";
      state.backendTranscript = "";
      state.revisionText = "";
      state.recordedSamples = [];
      state.realtimeChunkCursor = 0;
      state.voiceFinishTriggered = false;
      state.recognitionBlocked = false;
      reviseFeed.innerHTML = `<div class="bubble system">正在持续收音，直接说要替换、删除或补充什么</div>`;
      revisionTitle.textContent = "正在打开麦克风";
      revisionHint.textContent = "直接说哪里要改，也可以补充或删除。";
      revisionButton.disabled = true;
      revisionButton.textContent = "正在准备收音";

      try {
        state.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        state.isRecording = true;
        state.lastAudioActivityAt = Date.now();
        state.lastRecognitionResultAt = Date.now();
        state.lastBrowserRecognitionAt = 0;
        startWavRecorder(state.stream);
        startSpeechRecognition();
        state.recorder = { type: "wav" };
        startRecordingHealthCheck();
        startRealtimeBackendAsr();
        updateRecordButtons();
        revisionTitle.textContent = "正在听你修改";
        revisionHint.textContent = "例如：把‘白色小车’改成‘红色小车’。";
        revisionButton.disabled = false;
        revisionButton.textContent = "说好了，帮我改";
      } catch {
        state.isRecording = false;
        stopRecordingTracks();
        updateRecordButtons();
        revisionTitle.textContent = "没有拿到麦克风权限";
        revisionHint.textContent = "请允许麦克风后再试。";
        revisionButton.disabled = false;
        revisionButton.textContent = "重新收音";
      }
    }

    async function transcribeRevision(blob, browserText) {
      if (!blob || blob.size < 800) return browserText;
      try {
        const form = new FormData();
        form.append("audio", blob, `revision-${Date.now()}.wav`);
        form.append("kind", "revision");
        const response = await fetch("/api/asr", { method: "POST", body: form });
        if (!response.ok) return browserText;
        const data = await response.json();
        if (data.provider === "mock") return browserText;
        return String(data.text || browserText).trim();
      } catch {
        return browserText;
      }
    }

    async function applyRevision() {
      if (!state.diary) {
        say("先生成日记再修改");
        return;
      }
      if (!state.isRecording) {
        await startRevisionFlow();
        return;
      }

      revisionButton.disabled = true;
      revisionButton.textContent = "正在听清楚";
      state.isRecording = false;
      stopRecordingHealthCheck();
      stopRealtimeBackendAsr();
      updateRecordButtons();
      stopSpeechRecognition();
      const blob = stopWavRecorder();
      stopRecordingTracks();
      state.recorder = null;
      const heardText = revisionTranscript() || realtimeTranscript();
      state.revisionText = await transcribeRevision(blob, heardText);
      state.liveTranscript = "";
      state.liveInterimTranscript = "";
      state.backendTranscript = "";

      if (!state.revisionText) {
        revisionTitle.textContent = "刚才没有听清";
        revisionHint.textContent = "不会使用默认修改，请重新说一次。";
        revisionButton.disabled = false;
        revisionButton.textContent = "重新收音";
        say("没有听清，不会自动乱改");
        return;
      }

      const bubble = document.createElement("div");
      bubble.className = "bubble child";
      bubble.textContent = state.revisionText;
      reviseFeed.appendChild(bubble);
      reviseFeed.scrollTop = reviseFeed.scrollHeight;
      revisionTitle.textContent = "正在核对要改的事实";
      revisionHint.textContent = "只会修改能和原日记对应上的内容。";
      const factsBeforeRevision = state.facts.map(fact => ({ ...fact }));

      try {
        const response = await fetch("/api/revise", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            instruction: state.revisionText,
            facts: activeFacts().map(({ id, slot, label, text, quote }) => ({ id, slot, label, text, quote })),
            diary: state.diary.sentences.map(sentence => sentence.text)
          })
        });
        if (!response.ok) throw new Error(`revise ${response.status}`);
        const data = await response.json();
        const operations = Array.isArray(data.operations) ? data.operations : [];
        let changed = 0;
        for (const operation of operations) {
          if (operation.type === "replace") {
            const fact = state.facts.find(item => item.active && item.id === operation.target_fact_id);
            if (!fact || !operation.new_text) continue;
            const oldText = fact.text;
            fact.text = operation.new_text;
            fact.quote = state.revisionText;
            fact.source = "语音修改";
            if (operation.slot) fact.slot = operation.slot;
            if (operation.label) fact.label = operation.label;
            state.facts.forEach(item => {
              if (item.active && item.id !== fact.id && factsOverlap(item.text, oldText)) item.active = false;
            });
            changed += 1;
          } else if (operation.type === "delete") {
            const fact = state.facts.find(item => item.active && item.id === operation.target_fact_id);
            if (!fact) continue;
            fact.active = false;
            changed += 1;
          } else if (operation.type === "add" && operation.new_text && operation.slot) {
            state.facts.forEach(item => {
              if (item.active && isNegatedFact(item.text) && !isNegatedFact(operation.new_text) &&
                  sharesSpecificPhrase(item.text, operation.new_text)) item.active = false;
            });
            const existing = state.facts.find(item => item.active && factsOverlap(item.text, operation.new_text));
            if (existing) {
              existing.text = operation.new_text;
              existing.quote = state.revisionText;
              existing.source = "语音修改";
              changed += 1;
              continue;
            }
            state.facts.push({
              id: `rev_${Date.now()}_${changed}`,
              slot: operation.slot,
              label: operation.label || "语音补充",
              text: operation.new_text,
              source: "语音修改",
              quote: state.revisionText,
              active: true
            });
            changed += 1;
          }
        }

        pruneActiveFactDuplicates();

        if (!changed) {
          revisionTitle.textContent = "还没找到要改的地方";
          revisionHint.textContent = data.message || "请说清楚原来哪里不对，以及想改成什么。";
          revisionButton.disabled = false;
          revisionButton.textContent = "重新收音";
          return;
        }

        state.utterances.push({ source: "语音修改", text: state.revisionText, kind: "revision" });
        renderFacts();
        const diary = await composeDiaryWithModel();
        const validation = validateDiary(diary);
        if (!validation.ok) throw new Error("revision validation failed");
        state.diary = diary;
        renderDiary(diary, validation);
        show("diary");
        say(`已按你的话修改 ${changed} 处`);
      } catch {
        state.facts = factsBeforeRevision;
        revisionTitle.textContent = "这次没有改成功";
        revisionHint.textContent = "原日记保持不变，可以重新说一次。";
        revisionButton.disabled = false;
        revisionButton.textContent = "重新收音";
      }
    }

    function readDiary() {
      if (!state.diary) {
        say("先生成日记");
        return;
      }
      readState.classList.add("show");
      say("开始朗读");
      window.setTimeout(() => {
        readState.classList.remove("show");
        say("朗读完成");
      }, 1800);
    }

    function saveDiary() {
      if (!state.diary) {
        say("还没有可保存的日记");
        return;
      }
      try {
        localStorage.setItem("tongxinDiary:lastSaved", JSON.stringify({
          savedAt: new Date().toISOString(),
          title: state.diary.title,
          body: state.diary.sentences.map(sentence => sentence.text).join("")
        }));
      } catch (error) {
        say("已先保存在本页草稿");
      }
      show("success");
    }

    document.addEventListener("click", event => {
      const button = event.target.closest("[data-action]");
      if (!button) return;
      const action = button.dataset.action;

      if (action === "start") startFlow();
      if (action === "continue") continueFlow();
      if (action === "finish") finishSpeaking();
      if (action === "read") readDiary();
      if (action === "save") saveDiary();
      if (action === "revise") startRevisionFlow();
      if (action === "applyRevision") applyRevision();
      if (action === "restart") {
        resetSession();
        reviseFeed.innerHTML = `<div class="bubble ai">小耳朵会只改你说错的事实。</div>`;
        show("home");
      }
    });
  </script>
</body>
